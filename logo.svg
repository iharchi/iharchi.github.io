<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Outer circle background -->
  <circle cx="200" cy="200" r="200" fill="#2c4a6a"/>

  <!-- Inner circle background -->
  <circle cx="200" cy="200" r="180" fill="#1e3a5f"/>

  <!-- Gold border circle -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#d4af37" stroke-width="3"/>

  <!-- IH Text -->
  <text x="200" y="210" font-family="Georgia, serif" font-size="140" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-5">IH</text>

  <!-- Decorative line -->
  <line x1="140" y1="260" x2="260" y2="260" stroke="#d4af37" stroke-width="2"/>

  <!-- REAL ESTATE Text -->
  <text x="200" y="295" font-family="Georgia, serif" font-size="24" font-weight="normal" fill="#d4af37" text-anchor="middle" letter-spacing="8">REAL ESTATE</text>
</svg>
